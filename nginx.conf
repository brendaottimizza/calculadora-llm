server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Vite generates content-hashed assets that can be cached indefinitely.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Always revalidate the entry point after a new deployment.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Support direct navigation and reloads on SPA routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
