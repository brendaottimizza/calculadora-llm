kind = "web"
previewPath = "/"
title = "TokenScope — Calculadora de LLMs"
description = "Calculadora de custos de LLMs em português com catálogo público OpenRouter, comparação reativa de tokens em USD e BRL, gráfico empilhado e favoritos locais."
version = "1.0.0"
id = "artifacts/llm-costs"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20020

[services.development]
run = "pnpm --filter @workspace/llm-costs run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/llm-costs", "run", "build" ]
serve = "static"
publicDir = "artifacts/llm-costs/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20020"
BASE_PATH = "/"
